name: Probas

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "site/**"]

jobs:
  probas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/weekly.py --sen-rede --sen-claude
